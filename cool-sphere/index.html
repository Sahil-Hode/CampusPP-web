<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Realistic Sphere</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Makes it crisp on retina screens
        document.body.appendChild(renderer.domElement);

        // 2. THE SPHERE
        // Higher numbers (64, 64) make it perfectly smooth
        const geometry = new THREE.SphereGeometry(1, 64, 64); 
        const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,   // White color
            metalness: 0.1,    // A little bit of shine
            roughness: 0.5     // Medium matte finish
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // 3. LIGHTING (The secret to realism)
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 5, 5);
        scene.add(light);

        const ambient = new THREE.AmbientLight(0x404040, 1); // Soft shadows
        scene.add(ambient);

        camera.position.z = 3;

        // 4. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.005; 
            sphere.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
